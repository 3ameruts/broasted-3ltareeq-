<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>منيو بروستد عالطريق: نسخة الهوية</title>
<script src="../../node_modules/@svgdotjs/svg.js/dist/svg.min.js"></script>
<style>
  /* brand fonts, same as the website and packaging */
  @font-face { font-family: Lalezar; src: url(../../packaging/assets/lalezar.ttf); }
  @font-face { font-family: Readex; font-weight: 700; src: url(../../packaging/assets/readex-700.ttf); }
  @font-face { font-family: Readex; font-weight: 500; src: url(fonts/readex-500.ttf); }

  /* brand colours from src/styles.css */
  :root {
    --red: #e0263a; --red-deep: #b21017; --yellow: #fcb712; --mustard: #f0b84a; --asphalt: #363336; --asphalt-deep: #262326;
    --paper: #fbf5ea; --ink: #2a2528; --ink-soft: #6b5f62; --line: #eadfcd;
    --sticker: 0 0 0 4px #fff, 0 0 0 7px var(--asphalt), 0 14px 30px rgb(38 35 38 / .28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: Readex, sans-serif; font-weight: 500; color: var(--ink); }
  .page { width: 1080px; height: 1350px; position: relative; overflow: hidden; display: flex; flex-direction: column;
    background: radial-gradient(900px 800px at 50% 40%, #ea3446, var(--red) 60%, #c81a2c 100%); }
  .page > svg.bg { position: absolute; inset: 0; z-index: 0; }
  .page > :not(svg) { position: relative; z-index: 1; }

  .top { flex: none; display: flex; align-items: center; gap: 22px; padding: 30px 46px 0; height: 210px; }
  .top .logo { height: 150px; filter: drop-shadow(0 10px 14px rgb(60 0 8 / .35)); }
  .top svg.title { flex: 1; height: 170px; overflow: visible; }
  .page > .num { position: absolute; z-index: 2; }
  .num { top: 34px; left: 46px; background: var(--asphalt); color: var(--yellow); font: 400 26px/1 Lalezar; padding: 10px 18px 6px; border-radius: 12px; box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--asphalt); direction: ltr; }

  .body { flex: 1; min-height: 0; padding: 18px 46px 26px; display: flex; flex-direction: column; gap: 30px; }

  /* paper panel with the site's sticker edge and a checker strip like the packaging */
  .panel { background: var(--paper); border-radius: 24px; box-shadow: var(--sticker); position: relative; }
  .panel .hd { display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 64px; border-radius: 24px 24px 0 0;
    background: linear-gradient(var(--paper), var(--paper)) padding-box; position: relative; }
  .panel .hd::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
    background: repeating-conic-gradient(var(--asphalt) 0 25%, #fff 0 50%) 0 0 / 12px 12px; }
  .panel .hd h3 { font: 400 40px/1 Lalezar; color: var(--red); padding-top: 8px; }
  .panel .in { padding: 8px 26px 12px; }
  .panel.photo .in, .panel.photo .hd { padding-left: 250px; }
  .pic { position: absolute; left: 24px; top: 26px; width: 206px; height: 206px; border-radius: 50%; overflow: hidden; box-shadow: var(--sticker); }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .drum { position: absolute; width: 74px; filter: drop-shadow(0 6px 6px rgb(0 0 0 / .25)); }

  .rows { list-style: none; }
  .fill .panel { flex: 1; display: flex; flex-direction: column; }
  .fill .panel .in { flex: 1; display: flex; }
  .fill .panel .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .fill .name { font-size: 29px; }
  .fill .contents { font-size: 19px; }
  .row { padding: 10px 0; }
  .row + .row { border-top: 3px dashed var(--line); }
  .line { display: flex; align-items: baseline; gap: 10px; }
  .name { font: 700 27px/1.3 Readex; color: var(--asphalt); }
  .lead { flex: 1; border-bottom: 4px dotted #dccdb6; translate: 0 -7px; min-width: 14px; }
  .price { font: 400 38px/1 Lalezar; color: var(--red); white-space: nowrap; direction: ltr; }
  .price small { font-size: 20px; color: var(--ink-soft); margin-left: 4px; }
  .contents { font: 500 18px/1.5 Readex; color: var(--ink-soft); }
  .tight .row { padding: 7px 0; }
  .tight .name { font-size: 25px; }
  .tight .price { font-size: 34px; }

  /* sandwiches: stickers floating on the red backdrop, names on asphalt road labels */
  .sand { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 18px 10px; padding-top: 4px; }
  .sw { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  .sw img { height: 196px; max-width: 100%; object-fit: contain; filter: drop-shadow(0 12px 12px rgb(60 0 8 / .35)); }
  .sw:nth-child(odd) img { rotate: -3deg; } .sw:nth-child(even) img { rotate: 3deg; }
  .road-label { margin-top: -10px; position: relative; background: var(--asphalt); color: #fff; font: 400 25px/1.1 Lalezar; padding: 9px 14px 14px; border-radius: 10px; box-shadow: 0 0 0 3px #fff; min-width: 150px; }
  .road-label::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 5px; height: 3px; background: repeating-linear-gradient(to left, var(--yellow) 0 12px, transparent 12px 20px); }
  .sw .desc { margin-top: 10px; font: 500 17px/1.5 Readex; color: #fff; padding: 0 2px; }

  /* yellow road sign (diamond) */
  .diamond { width: 150px; height: 150px; position: relative; display: grid; place-items: center; flex: none; }
  .diamond::before { content: ""; position: absolute; inset: 22px; background: var(--yellow); border-radius: 14px; rotate: 45deg; box-shadow: inset 0 0 0 4px var(--yellow), inset 0 0 0 8px var(--asphalt), 0 0 0 4px #fff, 0 8px 14px rgb(0 0 0 / .25); }
  .diamond span { position: relative; text-align: center; font: 400 34px/1 Lalezar; color: var(--asphalt); direction: ltr; }
  .diamond small { display: block; font: 700 14px/1.2 Readex; direction: rtl; }

  /* stop sign with the slogan, like the Share Box carton */
  .stop { width: 190px; height: 190px; flex: none; position: relative; display: grid; place-items: center; text-align: center; filter: drop-shadow(0 10px 12px rgb(0 0 0 / .3)); }
  .stop::before, .stop::after { content: ""; position: absolute; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .stop::before { inset: 0; background: #fff; }
  .stop::after { inset: 8px; background: var(--red-deep); }
  .stop span { position: relative; z-index: 1; font: 400 30px/1.15 Lalezar; color: #fff; padding: 0 18px; }

  /* share box in the carton's mustard */
  .duo { display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; flex: 1; min-height: 0; }
  .card { border-radius: 24px; box-shadow: var(--sticker); overflow: hidden; display: flex; flex-direction: column; background: var(--paper); }
  .card.mustard { background: var(--mustard); }
  .card .ph { height: 180px; flex: none; }
  .card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .card .t { flex: 1; padding: 14px 22px 18px; display: flex; flex-direction: column; gap: 8px; }
  .card .k { font: 700 19px/1 Readex; color: var(--red-deep); }
  .card b { font: 400 42px/1.05 Lalezar; color: var(--asphalt); }
  .card .price { margin-top: auto; font-size: 50px; }
  .mini { list-style: none; display: flex; flex-wrap: wrap; gap: 7px; }
  .mini li { font: 700 17px/1 Readex; padding: 8px 12px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 3px var(--asphalt); }

  /* sauces as yellow road signs */
  .signs { display: flex; justify-content: center; gap: 0; margin-top: -4px; }
  .signs .diamond { width: 136px; height: 136px; }
  .signs .diamond span { font: 400 22px/1.05 Lalezar; padding: 0 30px; direction: rtl; }

  /* footer: a strip of road with the red car, like the packaging */
  .road { flex: none; height: 128px; background: var(--asphalt); position: relative; color: #fff; display: flex; align-items: center; gap: 26px; padding: 14px 46px 50px; font: 700 21px/1 Readex; }
  .road::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-conic-gradient(var(--asphalt) 0 25%, #fff 0 50%) 0 0 / 14px 14px; }
  .road::after { content: ""; position: absolute; left: 0; right: 0; bottom: 16px; height: 6px; background: repeating-linear-gradient(to left, var(--yellow) 0 46px, transparent 46px 80px); }
  .road .i { display: flex; align-items: center; gap: 9px; }
  .road svg.ic { width: 25px; height: 25px; color: var(--yellow); }
  .road .phone { font: 400 40px/1 Lalezar; color: var(--yellow); direction: ltr; padding-top: 6px; }
  .road .sep { flex: 1; }
  .car { position: absolute; left: 470px; bottom: 4px; width: 92px; z-index: 2; }
</style>
</head>
<body>
<div id="out"></div>
<script>
const M = window.MENU, ICON = window.ICONS;
const IMG = p => '../../public/' + p;
const STK = img => 'sticker/' + img.match(/item-(\d+)/)[1] + '.png';
const DRUM = '../../packaging/assets/drumstick.png';
const cat = id => M.categories.find(c => c.id === id);
const money = n => n.toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const B = M.brand;
const branches = M.branches.map(b => b.name.replace('فرع ', '')).join(' · ');
const insta = B.instagram.replace(/\/$/, '').split('/').pop();
const ic = s => s.replace('<svg', '<svg class="ic"');

const price = p => `<span class="price">${money(p)}<small>د.أ</small></span>`;
const row = it => `<li class="row"><div class="line"><span class="name">${esc(it.name)}</span><span class="lead"></span>${price(it.price)}</div>${it.contents ? `<p class="contents">${esc(it.contents)}</p>` : ''}</li>`;
// the red car from the packaging
const car = `<svg class="car" viewBox="0 0 124 62"><path d="M8 44 C 6 32, 14 26, 26 25 L 38 12 C 42 8, 46 7, 54 7 L 78 7 C 86 7, 90 9, 95 15 L 104 25 C 114 26, 120 31, 119 44 Z" fill="#e0263a" stroke="#fff" stroke-width="3"/><path d="M42 24 L 50 13 L 64 13 L 64 24 Z M 69 24 L 69 13 L 82 13 C 86 13, 88 15, 91 19 L 95 24 Z" fill="#cfe7f2"/><circle cx="32" cy="46" r="10" fill="#262326" stroke="#fff" stroke-width="3"/><circle cx="92" cy="46" r="10" fill="#262326" stroke="#fff" stroke-width="3"/><rect x="108" y="30" width="8" height="5" rx="2" fill="#fcb712"/></svg>`;
const road = (withPhone = true) => `<div class="road">${withPhone ? `<span class="i">${ic(ICON.Phone)}<span class="phone">${esc(B.phone)}</span></span>` : ''}<span class="sep"></span><span class="i">${ic(ICON.AtSign)}<span>${esc(insta)}</span></span><span class="i">${ic(ICON.Globe)}<span>broasted3ltareeq.com</span></span>${car}</div>`;
let TOTAL = 0;
const topBar = (n, t) => `<div class="top"><img class="logo" src="../../brand/photos/brand/logo.png"><svg class="title" data-title="${esc(t)}"></svg></div><p class="num">${n}/${TOTAL}</p>`;
const panel = (c, img, extra = '') => `<section class="panel${img ? ' photo' : ''}"><div class="hd"><h3>${esc(c.name)}</h3></div>${img ? `<div class="pic"><img src="${IMG(img)}"></div>` : ''}<div class="in"><ul class="rows">${c.items.map(row).join('')}</ul></div>${extra}</section>`;

// title lettering drawn like the logo's "بروستد": asphalt letters, white edge, deep red outline
function letter(svg) {
  const d = SVG(svg), t = svg.dataset.title, size = 128, x = 0, y = 128;
  d.viewbox(-700, 0, 700, 170);
  const layer = (fill, stroke, w, dy = 0) => d.text(t).font({ family: 'Lalezar', size, anchor: 'start' }).attr({ x, y: y + dy, direction: 'rtl', 'paint-order': 'stroke', 'stroke-linejoin': 'round' }).fill(fill).stroke(stroke ? { color: stroke, width: w } : 'none');
  layer('#b21017', '#b21017', 34, 8);
  layer('#b21017', '#b21017', 34);
  layer('#fff', '#fff', 18);
  layer('#363336');
}

const slides = [
  // 1. meals
  n => `<div class="page">${topBar(n, 'الوجبات')}
    <div class="body fill" data-fit="meals">${panel(cat('broasted'), cat('broasted').image, `<img class="drum" src="${DRUM}" style="left:-26px;bottom:-30px;rotate:-24deg">`)}${panel(cat('tender'), cat('tender').image)}</div>${road()}</div>`,
  // 2. sandwiches
  n => {
    const s = cat('sandwiches');
    return `<div class="page">${topBar(n, s.name)}
      <div class="body" data-fit="sandwiches" style="gap:12px;padding-top:6px">
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-top:-26px"><p class="diamond"><span>${money(s.items[0].price)}<small>د.أ</small></span></p><p style="font:400 34px/1.2 Lalezar;color:#fff">${esc(s.note)}</p></div>
        <div class="sand">${s.items.map(it => `<div class="sw"><img src="${STK(it.image)}"><p class="road-label">${esc(it.name)}</p><p class="desc">${esc(it.contents)}</p></div>`).join('')}</div>
      </div>${road()}</div>`;
  },
  // 3. combos, share box, kids
  n => {
    const c = cat('combo'), k = cat('kids'), kid = k.items[0], sb = cat('sharebox'), si = sb.items[0];
    return `<div class="page">${topBar(n, 'الكومبو')}
      <div class="body" data-fit="combo">${panel(c, c.items.find(i => i.image).image)}
        <div class="duo">
          <section class="card mustard"><div class="ph"><img src="${IMG(sb.image)}"></div><div class="t"><b>${esc(si.name)}</b><ul class="mini">${si.contents.split('+').map(x => `<li>${esc(x.trim())}</li>`).join('')}</ul>${price(si.price)}</div></section>
          <section class="card"><div class="ph"><img src="${IMG(k.image)}"></div><div class="t"><p class="k">${esc(k.name)}</p><b>${esc(kid.name)}</b><p class="contents">${esc(kid.contents)}</p>${price(kid.price)}</div></section>
        </div></div>${road()}</div>`;
  },
  // 4. sides, sauces, contact
  n => {
    const sd = cat('sides'), sc = cat('sauces');
    return `<div class="page">${topBar(n, 'الإضافات')}
      <div class="body" data-fit="sides" style="gap:18px">
        <section class="panel"><div class="hd"><h3>${esc(sd.name)}</h3></div><div class="in"><ul class="rows tight" style="display:grid;grid-template-columns:1fr 1fr;column-gap:40px">${sd.items.map(row).join('')}</ul></div>
          <img class="drum" src="${DRUM}" style="left:-18px;bottom:-34px;rotate:-22deg"></section>
        <div><p style="text-align:center;font:400 40px/1 Lalezar;color:#fff">${esc(sc.name)} <span style="font:700 22px/1 Readex;color:#fcb712">${esc(sc.note || '')}</span></p>
          <div class="signs">${sc.items.map(it => `<p class="diamond"><span>${esc(it.name)}</span></p>`).join('')}</div></div>
        <div style="display:flex;align-items:center;gap:24px;margin-top:auto">
          <p class="stop"><span>${esc(B.slogan)}</span></p>
          <div class="panel" style="flex:1;padding:18px 26px;background:#363336;color:#fff">
            <p style="font:700 20px/1 Readex;color:#fcb712">اتصل واطلب</p><p style="font:400 56px/1.1 Lalezar;direction:ltr;text-align:right;margin:6px 0 4px">${esc(B.phone)}</p>
            <p style="font:500 19px/1.55 Readex">إربد: ${esc(branches)}<br>${esc(B.hours)}</p></div>
        </div>
      </div>${road(false)}</div>`;
  },
];
TOTAL = slides.length;
window.PAGES = TOTAL;
const q = new URLSearchParams(location.search).get('page') || '1';
window.ready = Promise.all([document.fonts.load('400 100px Lalezar', 'الوجبات'), document.fonts.load('700 20px Readex', 'ب'), document.fonts.load('500 20px Readex', 'ب')]).then(() => {
  document.getElementById('out').innerHTML = (q === 'all' ? slides.map((s, i) => s(i + 1)) : [slides[q - 1](Number(q))]).join('');
  document.querySelectorAll('svg.title').forEach(letter);
  return Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
});
</script>
</body>
</html>
